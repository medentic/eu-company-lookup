name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_TERM_COLOR: always
      RUSTDOCFLAGS: -D warnings
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install supported Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Check public source and history
        run: python3 tools/check_public_source.py --history HEAD
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
      - run: python3 tools/check_docs.py
      - run: python3 tools/check_distribution.py
      - name: Verify distributable crate
        run: cargo package --locked

      - name: Test extracted distributable
        run: |
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          cargo test --locked --all-targets --manifest-path "target/package/eu-company-lookup-$CRATE_VERSION/Cargo.toml"
          cargo test --locked --doc --manifest-path "target/package/eu-company-lookup-$CRATE_VERSION/Cargo.toml"

  stable:
    name: Stable Rust on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --locked --all-targets
      - run: cargo +stable test --locked --doc
