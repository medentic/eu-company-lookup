[package]
name = "eu-company-lookup"
version = "5.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Typed EU VAT verification and national company/taxpayer lookup with explicit provider capabilities"
license = "MIT AND BSD-3-Clause AND Apache-2.0"
repository = "https://github.com/medentic/eu-company-lookup"
documentation = "https://docs.rs/eu-company-lookup"
readme = "README.md"
keywords = ["vat", "vies", "eu", "company", "validation"]
categories = ["api-bindings"]
include = [
    "src/**/*.rs",
    "src/vies/fixtures/valid.xml",
    "src/vies/fixtures/report-contract.json",
    "src/vies/fixtures/review-policy.json",
    "tests/**/*.rs",
    "examples/**/*.rs",
    "docs/reference/api-stability.md",
    "docs/reference/errors.md",
    "docs/reference/company-result.md",
    "docs/reference/bulgarian-registry.md",
    "docs/reference/romanian-registry.md",
    "docs/reference/vies.md",
    "docs/examples/*.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD-PARTY-LICENSE.txt",
    "/CHANGELOG.md",
]

[dependencies]
base64 = "0.23.1"
chromiumoxide = "0.9.1"
futures-util = "0.3"
getrandom = "0.4"
httpdate = "1"
jiff = { version = "1", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
lopdf = { version = "0.47", default-features = false }
regex-lite = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "cookies"] }
roxmltree = "0.21"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "process", "io-util"] }

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[profile.dev]
debug = 1
