[package]
name = "eu-company-lookup"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Typed EU VAT validation through VIES, with explicit failures and capability discovery"
license = "MIT AND BSD-3-Clause"
repository = "https://github.com/medentic/eu-company-lookup"
documentation = "https://docs.rs/eu-company-lookup"
readme = "README.md"
keywords = ["vat", "vies", "eu", "company", "validation"]
categories = ["api-bindings"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "THIRD-PARTY-LICENSE.txt", "CHANGELOG.md"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
httpdate = "1"
regex-lite = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.dev]
debug = 1
